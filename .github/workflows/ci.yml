name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Build and publish a release (tag v<peribatt.__version__>)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  web:
    # The settings UI (React + Fluent UI) is committed pre-built in peribatt/webui so
    # the app runs without Node; this checks that build matches its source.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - name: Committed build is up to date
        run: git diff --exit-code --stat -- peribatt/webui || (echo "Run 'npm run build' in web/ and commit peribatt/webui" && exit 1)

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check .
      - name: Browser for the UI tests
        if: runner.os == 'Linux' && matrix.python == '3.12'
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - run: python -m pytest -q

  build:
    # Every push builds and runs the packaged app. Publishing only happens for a pushed
    # v* tag, or a manual run with "release" ticked (the release then creates the tag).
    needs: [web, test]
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release) }}
      SIGN_PFX_BASE64: ${{ secrets.SIGN_PFX_BASE64 }}
      SIGN_PFX_PASSWORD: ${{ secrets.SIGN_PFX_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Version (a pushed tag must match the app version)
        shell: pwsh
        run: |
          $app = python -c "import peribatt; print(peribatt.__version__)"
          if ("$env:GITHUB_REF" -like "refs/tags/v*") {
            $tag = "$env:GITHUB_REF_NAME".TrimStart("v")
            if ($tag -ne $app) { throw "tag v$tag but peribatt.__version__ is $app" }
          }
          "VERSION=$app" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Build the app
        run: .\build.bat
        shell: cmd
      - name: Smoke-test the built app
        shell: pwsh
        run: |
          $p = Start-Process dist\PeripheralsBattery\PeripheralsBattery.exe -ArgumentList "--once" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "PeripheralsBattery.exe --once exited with $($p.ExitCode)" }
          if (-not (Test-Path dist\PeripheralsBattery\_internal\peribatt\webui\index.html)) { throw "settings UI missing from the build" }
      - name: Smoke-test the packaged tray app
        shell: pwsh
        run: |
          # Run the real .exe as a tray app for a while, then read its log: it must have
          # started, searched for devices and shown an icon, without a single error.
          $data = Join-Path $env:RUNNER_TEMP "pb-home"
          New-Item -ItemType Directory $data | Out-Null
          '{"settings": {"first_run_done": true, "welcomed": true}}' | Set-Content "$data\settings.json"
          $env:PERIBATT_HOME = $data
          $p = Start-Process dist\PeripheralsBattery\PeripheralsBattery.exe -PassThru
          Start-Sleep -Seconds 15
          $alive = -not $p.HasExited
          if ($alive) { Stop-Process -Id $p.Id -Force }
          $log = Get-Content "$data\peribatt.log" -Raw
          Write-Host $log
          if (-not $alive) { throw "the tray app exited on its own (code $($p.ExitCode))" }
          if ($log -notmatch "started") { throw "no startup line in the log" }
          if ($log -notmatch "tray icon shown") { throw "no tray icon was shown" }
          if ($log -notmatch "logitech: \d+ device") { throw "the first device search never finished" }
          if ($log -match "CRITICAL|ERROR|Traceback") { throw "errors in the log" }
      - name: Sign the app
        if: env.RELEASE == 'true'
        shell: pwsh
        run: installer\sign.ps1 dist\PeripheralsBattery\PeripheralsBattery.exe
      - name: Build the installer
        if: env.RELEASE == 'true'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          & $iscc "/DAppVersion=$env:VERSION" installer\PeripheralsBattery.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
      - name: Sign the installer
        if: env.RELEASE == 'true'
        shell: pwsh
        run: installer\sign.ps1 "dist\PeripheralsBattery-$env:VERSION-setup.exe"
      - name: Zip the portable build
        if: env.RELEASE == 'true'
        shell: pwsh
        run: Compress-Archive -Path dist\PeripheralsBattery -DestinationPath "dist\PeripheralsBattery-$env:VERSION-windows.zip"
      - uses: actions/upload-artifact@v4
        if: env.RELEASE == 'true'
        with:
          name: PeripheralsBattery-${{ env.VERSION }}
          path: |
            dist/PeripheralsBattery-*-setup.exe
            dist/PeripheralsBattery-*-windows.zip
      - uses: softprops/action-gh-release@v2
        if: env.RELEASE == 'true'
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: Peripherals Battery ${{ env.VERSION }}
          generate_release_notes: true
          files: |
            dist/PeripheralsBattery-${{ env.VERSION }}-setup.exe
            dist/PeripheralsBattery-${{ env.VERSION }}-windows.zip
